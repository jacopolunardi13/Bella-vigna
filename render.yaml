# Bella Vigna Firenze — private staging
#
# One long-running Node service: the real server, the real routes, the real
# scheduler, on its own URL, its own (empty) storage and its own generated secrets.
# It shares nothing with LunArt's services: not the URL, not the Staff token, not the
# card signing key, not the data. Same core code, separate deployment — that is the
# tenant isolation model (see docs/AUDIT.md).
#
# `GUIDE_PREVIEW=1` is the whole safety story. It is read in `server/config.js`
# before anything else, and it does not merely default things to safe values — it
# refuses to read the dangerous ones at all. A live Stripe key, a Gmail refresh
# token, a VAPID key, a calendar service account or the Wi-Fi password pasted into
# this service by mistake is ignored: payments run on the built-in stand-in, no
# email leaves, no mailbox is read, no calendar is written, nothing is pushed, and
# the Wi-Fi password is never served.
#
# Two values are generated by Render, so nobody has to invent or share them: the
# Staff token and the Privilege Card signing key. Read the Staff token once in the
# dashboard under Environment.
#
# This deploys the Bella Vigna work branch. It does not touch `main`, the GitHub
# Pages site (if any), LunArt, or anything in production.

services:
  - type: web
    name: bella-vigna-preview
    runtime: node
    plan: free
    region: frankfurt          # closest to Florence; change freely
    branch: ccr-412adc5b-p2jc5l
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # Demonstration mode. Everything below depends on this being "1".
      - key: GUIDE_PREVIEW
        value: "1"

      # Production mode has one effect that matters here: the Staff API refuses
      # every request unless a token is configured, rather than falling open the way
      # a development server does.
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      # Generated by Render, visible once in the dashboard. Nobody types it, nobody
      # commits it, and it is not LunArt's.
      - key: STAFF_TOKEN
        generateValue: true

      # Also generated: without it the server makes one at boot, and every restart
      # would invalidate every Privilege Card issued in the demo.
      - key: CARD_SIGNING_KEY
        generateValue: true

      # Every loop that reaches outside stays off. Housekeeping only retires stays
      # that have already ended, which is local and harmless.
      - key: RESERVATION_POLL_MINUTES
        value: "0"
      - key: DELIVERY_POLL_MINUTES
        value: "0"
      - key: ICAL_POLL_MINUTES
        value: "0"
      - key: HOUSEKEEPING_MINUTES
        value: "60"

      # Deliberately absent: GUIDE_DATA_DIR (staging forgets on restart, which for a
      # demonstration is a feature), PUBLIC_URL (the server falls back to
      # RENDER_EXTERNAL_URL), and every credential — see docs/GO-LIVE.md for the
      # production service, which is a separate blueprint decision.
