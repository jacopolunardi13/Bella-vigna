# Staging: Bella Vigna guide + LunArt (PR branch) + the shared Staff console
#
# Three free web services and one free database, all in demonstration mode,
# none of them production:
#
#   bella-vigna-preview     the Bella Vigna guide and its Staff API (this branch)
#   lunart-staff-staging    LunArt's code from the PR branch `feat/staff-console-bridge`
#                           (jacopolunardi13/lunart#6), in LUNART_PREVIEW mode, with
#                           invented reservations — NOT LunArt's production service
#   staff-console-staging   the single Staff app for both houses (passkeys)
#   staff-console-staging-db  the console's people and passkeys (free Postgres)
#
# Safety: GUIDE_PREVIEW=1 / LUNART_PREVIEW=1 are read first by each server and make
# it refuse every dangerous credential: payments run on the built-in stand-in, no
# email leaves, no mailbox is read, no calendar is written, the Wi-Fi password is
# never served. The console holds no guest data; it reads the two staging servers
# through their Staff APIs.
#
# Every secret is generated by Render, on one side only, and referenced by the
# other: nobody types, shares or commits one. The only one a person reads is the
# console's CONSOLE_SETUP_CODE (console service → Environment), once, for the
# owner's first passkey.
#
# Costs: all plans are `free`. Free web services sleep after ~15 minutes idle (the
# next request takes ~30–60 s). The free database expires 30 days after creation:
# then delete it, or upgrade it only after approval.
#
# Addresses: the three public URLs below are what Render assigns when the service
# names are free. If Render shows a different address for a service, change it once
# in the `staff-staging-links` environment group.

envVarGroups:
  - name: staff-staging-links
    envVars:
      - key: CONSOLE_URL
        value: https://staff-console-staging.onrender.com
      - key: CONSOLE_PROPERTY_BELLA_VIGNA_URL
        value: https://bella-vigna-preview.onrender.com
      - key: CONSOLE_PROPERTY_LUNART_URL
        value: https://lunart-staff-staging.onrender.com

databases:
  - name: staff-console-staging-db
    plan: free
    region: frankfurt
    databaseName: staff_console
    user: staff_console
    # Reachable from Render services only, never from the internet.
    ipAllowList: []

services:
  # ── Bella Vigna: the guide and its Staff API ───────────────────────────────
  - type: web
    name: bella-vigna-preview
    runtime: node
    plan: free
    region: frankfurt          # closest to Florence
    branch: ccr-412adc5b-p2jc5l
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Demonstration mode. Everything below depends on this being "1".
      - key: GUIDE_PREVIEW
        value: "1"
      # Production mode's one effect here: the Staff API refuses every request
      # without a credential instead of falling open like a development server.
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # The old per-house Staff app (/staff) keeps its own token in staging, as the
      # test bench of the API; people use the console.
      - key: STAFF_TOKEN
        generateValue: true
      - key: CARD_SIGNING_KEY
        generateValue: true
      # The console's own credential on this Staff API, and the secret that signs
      # the notifications sent to the console. Generated here, read by the console.
      - key: CONSOLE_SERVICE_TOKEN
        generateValue: true
      - key: CONSOLE_RELAY_SECRET
        generateValue: true
      - fromGroup: staff-staging-links
      # Every loop that reaches outside stays off.
      - key: RESERVATION_POLL_MINUTES
        value: "0"
      - key: DELIVERY_POLL_MINUTES
        value: "0"
      - key: ICAL_POLL_MINUTES
        value: "0"
      - key: HOUSEKEEPING_MINUTES
        value: "60"
      # Deliberately absent: GUIDE_DATA_DIR (staging forgets on restart and reseeds
      # its invented reservations), PUBLIC_URL (falls back to RENDER_EXTERNAL_URL),
      # and every real credential.

  # ── LunArt, from its PR branch, in demonstration mode ──────────────────────
  - type: web
    name: lunart-staff-staging
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/jacopolunardi13/lunart
    branch: feat/staff-console-bridge
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LUNART_PREVIEW
        value: "1"
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: STAFF_TOKEN
        generateValue: true
      - key: CARD_SIGNING_KEY
        generateValue: true
      - key: CONSOLE_SERVICE_TOKEN
        generateValue: true
      - key: CONSOLE_RELAY_SECRET
        generateValue: true
      - fromGroup: staff-staging-links
      - key: RESERVATION_POLL_MINUTES
        value: "0"
      - key: DELIVERY_POLL_MINUTES
        value: "0"
      - key: ICAL_POLL_MINUTES
        value: "0"
      - key: HOUSEKEEPING_MINUTES
        value: "60"

  # ── The shared Staff console ───────────────────────────────────────────────
  - type: web
    name: staff-console-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: ccr-412adc5b-p2jc5l
    buildCommand: npm ci --omit=dev
    startCommand: node server/console/index.js
    healthCheckPath: /console/api/health
    autoDeploy: true
    envVars:
      # Says "Staging" on every screen.
      - key: CONSOLE_PREVIEW
        value: "1"
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # The owner's first passkey, and the owner's last resort. Read it once in
      # this service's Environment tab; change it after use.
      - key: CONSOLE_SETUP_CODE
        generateValue: true
      # People, passkeys, sessions, audit log: survives the free instance sleeping.
      - key: DATABASE_URL
        fromDatabase:
          name: staff-console-staging-db
          property: connectionString
      # Each house's address (from the group) and credentials (from that house).
      - fromGroup: staff-staging-links
      - key: CONSOLE_PROPERTY_BELLA_VIGNA_TOKEN
        fromService:
          type: web
          name: bella-vigna-preview
          envVarKey: CONSOLE_SERVICE_TOKEN
      - key: CONSOLE_PROPERTY_BELLA_VIGNA_RELAY_SECRET
        fromService:
          type: web
          name: bella-vigna-preview
          envVarKey: CONSOLE_RELAY_SECRET
      - key: CONSOLE_PROPERTY_LUNART_TOKEN
        fromService:
          type: web
          name: lunart-staff-staging
          envVarKey: CONSOLE_SERVICE_TOKEN
      - key: CONSOLE_PROPERTY_LUNART_RELAY_SECRET
        fromService:
          type: web
          name: lunart-staff-staging
          envVarKey: CONSOLE_RELAY_SECRET
      # CONSOLE_PUBLIC_URL is deliberately absent: the console uses
      # RENDER_EXTERNAL_URL, the address it actually has, and binds passkeys to it.
